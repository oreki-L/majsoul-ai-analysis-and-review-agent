[package]
name = "akagi-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
native_bot = { path = "vendor/native_bot", default-features = false, features = ["infer"] }
riichienv-core = "=0.4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
[profile.release]
strip = true
