<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Mortal 两阶段 · 离线 UI 验收</title>
<style>body{font:15px sans-serif;background:#eff3f7;margin:24px}#fixture-controls{position:fixed;left:20px;top:20px;width:260px}button{margin:5px;padding:9px}#panel{width:420px;margin-left:310px}</style>
<aside id="fixture-controls"><h2>Mortal 两阶段验收</h2><p>只使用人工快照与 mock 模型，不访问远端接口。</p><button id="next-event">下一决策事件</button><button id="same-turn">同巡鸣牌决策</button><button id="next-round">下一小局</button><button id="engine-stage">返回已校验动作（mock）</button><button id="explain-fail">解释失败（mock）</button><button id="resolve">返回最早待处理请求</button><button id="resolve-newest">返回最新待处理请求</button><pre id="requests"></pre></aside><main id="panel"></main>
<script src="../extension/state.js"></script><script src="../extension/contracts/snapshot.js"></script><script src="../extension/collector/snapshot-adapter.js"></script><script src="../extension/mahjong-analysis.js"></script><script src="../extension/analysis.js"></script><script src="../extension/decision-discussions.js"></script>
<script>
window.fixture={requests:[],pending:[],events:[],responseSerial:0}; const fixtureStorage=JSON.parse(sessionStorage.getItem('phase1-acceptance-store')||'{}'); fixture.store=MJDecisionDiscussions.create({storage:{get:async key=>structuredClone(fixtureStorage),set:async value=>{Object.assign(fixtureStorage,structuredClone(value));sessionStorage.setItem('phase1-acceptance-store',JSON.stringify(fixtureStorage))}}});
window.chrome={runtime:{id:'acceptance',getURL:p=>new URL('../extension/'+p,location.href).href,onMessage:{addListener(fn){fixture.listener=fn},removeListener(){}},async sendMessage(m){fixture.requests.push(m);document.querySelector('#requests').textContent=fixture.requests.map(m=>m.type+' '+(m.lane||'')).join('\n');if(m.type==='model:status')return {enabled:true,provider:'mjai',workflow:'mortal-explain',preferences:{automatic:true,useModel:true,consent:true,interval:1,modelFromTurn:1,limit:100}};if(m.type==='model:prepare')return {ok:true,data:m.engineRequest};if(m.type==='discussion:list')return {ok:true,records:await fixture.store.list()};if(m.type==='discussion:save')return {ok:true,record:await fixture.store.save(m.record)};if(m.type==='discussion:patch')return {ok:true,record:await fixture.store.patch(m.id,m.patch)};if(m.type==='discussion:ask')return {ok:true,record:await fixture.store.ask(m.id,m.question,m.token)};if(m.type==='model:analyze')return new Promise(resolve=>fixture.pending.push({m,resolve}));return {ok:true};}}};
</script><script src="../extension/official-mortal-report.js"></script><script src="../extension/postgame-review.js"></script><script src="../extension/analysis-panel.js"></script><script>
const state=__MJ_OBSERVER_STATE_V1__.initial('live',1);Object.assign(state,{round:{wind:0,index:0},scores:[25000,25000,25000,25000],phase:'playing',lastStep:0,selfHand:['1m','2m','3m','4m','5m','6m','7m','8m','9m','1s','2s','3s','4z','4z'],turn:1,turnProgress:{status:'known',source:'events',bySeat:[1,1,1,1],reason:null}});
fixture.state=state;let eventType='DealTile';
function render(){MJAnalysisPanel.mount(document.querySelector('#panel'),{snapshot:selection=>MJCollectorSnapshot.snapshot(state,selection),engineRequest:()=>({format:'majsoul-mjai-v1',seat:1,events:[]}),analysisContext:()=>({identity:{matchId:'acceptance-match',roundStartId:'round-'+state.round.index},position:state.lastStep,events:fixture.events}),seatLabels:['东家','南家','西家','北家'],phase:state.phase,matchEnded:state.result?.gameEnded===true,round:state.round,selfSeat:1,selfHand:state.selfHand,drawnTile:state.drawnTiles[1],hintsReady:false},{mode:'live',contextIdentity:'acceptance-match'},render,{onHints:value=>{fixture.latestHints=value}});}
fixture.render=render;fixture.advance=(same=false)=>{state.lastStep++;if(!same)state.turnProgress.bySeat[1]++;eventType=same?'ChiPengGang':'DealTile';fixture.events.push({kind:eventType,step:state.lastStep,seat:1});state.lastEvent={kind:eventType,step:state.lastStep,seat:1};render();};
fixture.action=()=>({ok:true,model:'MOCK Akagi weak example — UI only',workflow:'mortal-explain',engine:{format:'majsoul-engine-result-v1',phase:'draw',action:{type:'dahai',actor:1,pai:'1m'},followUp:null,candidates:[],limitations:[]},explanation:{status:'pending'},result:{task:'combined',danger:[],efficiency:[],decision:{action:'unknown',tile:'1m',reasons:['人工原建议：打出一万']},limitations:['此页仅验证UI，不是真实引擎/LLM推理。']}});
fixture.stage=async()=>{const p=fixture.pending[0];if(!p)return;const analysis=fixture.action();const record=await fixture.store.save({snapshot:p.m.snapshot,context:p.m.context,type:'combined',analysis});p.record=record;p.analysis=analysis;fixture.listener({type:'model:stage',clientRunId:p.m.clientRunId,record,analysis},{id:'acceptance'});};
fixture.respond=async(newest=false,failed=false)=>{const p=newest?fixture.pending.pop():fixture.pending.shift();if(!p)return;const explanation=failed?{status:'failed',error:'人工模拟 HTTP 错误；动作保留，费用未知。'}:{status:'completed',model:'MOCK teaching',summary:'这是一段后补教学解释。',reasons:['首选保持不变。'],limitations:['人工模拟。']};if(p.record){const record=await fixture.store.explain(p.record.id,explanation);p.resolve({...p.analysis,explanation,discussionRecord:record});}else p.resolve({...fixture.action(),explanation});};
document.querySelector('#engine-stage').onclick=()=>fixture.stage();document.querySelector('#explain-fail').onclick=()=>fixture.respond(false,true);
document.querySelector('#next-event').onclick=()=>fixture.advance();document.querySelector('#same-turn').onclick=()=>fixture.advance(true);document.querySelector('#next-round').onclick=()=>{state.round.index++;state.lastStep++;state.turnProgress.bySeat=[1,1,1,1];render();};document.querySelector('#resolve').onclick=()=>fixture.respond();document.querySelector('#resolve-newest').onclick=()=>fixture.respond(true);render();
</script></html>
