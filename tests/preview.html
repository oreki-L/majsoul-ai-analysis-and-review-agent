<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>牌局观察器 · 离线界面演示</title>
<style>body{margin:0;background:#e5edf2;color:#214764;font:16px/1.8 "Microsoft YaHei",sans-serif;padding:40px;max-width:650px}h1{font-size:26px}button{padding:10px 16px;margin:8px;border:1px solid #7b9bad;background:white;color:#214764;cursor:pointer}</style>
<h1>离线界面演示</h1><p>这里使用人工构造的数据，只验证面板和动态更新，不连接雀魂。右侧面板中的数据不是实采结果。</p>
<button id="draw">模拟自家摸牌</button><button id="discard">模拟自家弃牌</button><button id="replay">模拟载入四家牌谱</button>
<script src="../extension/state.js"></script><script src="../extension/history.js"></script><script src="../extension/contracts/snapshot.js"></script><script src="../extension/collector/snapshot-adapter.js"></script><script src="../extension/collector/controller.js"></script><script src="../extension/collector/browser-adapter.js"></script><script src="../extension/mahjong-analysis.js"></script><script src="../extension/analysis.js"></script><script src="../extension/adapters/mjai.js"></script><script src="../extension/adapters/naga-replay.js"></script><script src="../extension/naga-panel.js"></script><script src="../extension/postgame-review.js"></script><script src="../extension/analysis-panel.js"></script><script src="../extension/panel-theme.js"></script><script src="../extension/overlay.js"></script><script src="../extension/floating-panel.js"></script><script src="../extension/hand-hints.js"></script><script src="../extension/apps/agent-app.js"></script>
<script>
let seq=0,step=0;const hand=['7m','2p','4s','6s','8s','8s','8s','9s','2z','3z','4z','5z','6z'];
const post=(type,payload)=>window.postMessage({channel:'mj-observer-v1',epoch:'offline-demo',sequence:++seq,type,payload},location.origin);
const round={kind:'NewRound',source:'live',step:0,wind:0,round:0,honba:0,sticks:0,scores:[25000,25000,25000,25000],remaining:69,doras:['7p'],hand,operation:{seat:1,types:[1]}};
setTimeout(()=>{post('connection',{socketId:1,state:'open'});post('event',round);post('status',{sockets:1,incoming:1,gameEvents:1,errors:0});},250);
document.getElementById('draw').onclick=()=>post('event',{kind:'DealTile',source:'live',step:++step,seat:1,tile:'1m',remaining:68});
document.getElementById('discard').onclick=()=>post('event',{kind:'DiscardTile',source:'live',step:++step,seat:1,tile:'1m',tsumogiri:true});
document.getElementById('replay').onclick=()=>post('replay',{records:[{...round,source:'replay',hand:undefined,hands:[hand,hand,hand,hand]}, {kind:'DealTile',source:'replay',seat:0,tile:'0p',remaining:68},{kind:'DiscardTile',source:'replay',seat:0,tile:'0p',tsumogiri:true}]});
</script></html>
